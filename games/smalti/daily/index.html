<!-- The landing for the link the app shares: https://ninjaapps.net/games/smalti/daily/?d=YYYY-MM-DD
     An installed Smalti never shows this page: iOS opens the app instead (universal link,
     /.well-known/apple-app-site-association). Everyone else, and anyone who opens the link
     in a browser that does not hand it over, lands here. The link carries a day and nothing
     else: no account, no identifier. -->
<section class="app-hero">
  <div>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="../">Smalti</a></nav>
    <h1>Smalti</h1>
    <h2 class="share-line" id="daily-line">A new mosaic awaits</h2>
    <script>
    // ?d=YYYY-MM-DD is the sharer's own local day. Anything that is not exactly
    // one real calendar day between the first daily (2026-07-01) and the day after
    // tomorrow leaves the default line above in place.
    (function () {
      var line = document.getElementById('daily-line');
      var asked = new URLSearchParams(location.search).getAll('d');
      var m = asked.length === 1 && /^(\d{4})-(\d{2})-(\d{2})$/.exec(asked[0]);
      if (!line || !m) return;
      var y = +m[1], mo = +m[2], d = +m[3];
      var day = Date.UTC(y, mo - 1, d), when = new Date(day);
      if (when.getUTCFullYear() !== y || when.getUTCMonth() !== mo - 1 || when.getUTCDate() !== d) return;
      var now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      if (day < Date.UTC(2026, 6, 1) || day > today + 2 * 864e5) return;
      var label;
      try {
        label = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(when);
      } catch (e) { label = m[0]; }
      var time = document.createElement('time');
      time.dateTime = m[0];
      time.textContent = label;
      line.textContent = 'I restored the mosaic for ';
      line.appendChild(time);
    })();
    </script>
    <p class="lede">A calm daily mosaic puzzle. No ads, no account, no data collected.</p>
    <div class="actions share-actions">
      <a class="ticket" href="https://apps.apple.com/app/id6792641328"><span>Get Smalti on the App Store</span></a>
    </div>
    <p class="share-open">Already have it? <a href="mosaicrush://daily">Open today's puzzle</a></p>
  </div>
  <div class="hero-side">
    <img class="app-icon" src="../icon-320.webp" alt="Smalti app icon" width="160" height="160">
  </div>
