# Deploys ninjaapps.net. Every push to main is tested, built, checked and
# minified here, so what goes live is right even if the build wasn't run
# locally. The README's "Deploy" section explains each step.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test the tools and the scripts
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          for test in tools/test-*.mjs; do node "$test"; done

      # Minify before the build, so each page asks for the minified file by its hash.
      - name: Minify the stylesheet and scripts
        run: npx --yes esbuild@0.24.2 style.css assets/*.js --minify --outdir=. --allow-overwrite --log-level=warning

      - name: Test the minified scripts
        run: for test in tools/test-*.mjs; do node "$test"; done

      - name: Build the pages
        run: python3 tools/dayfolio-build.py

      - name: Check the site
        run: python3 tools/check-site.py

      # Only the pages and the files they use, plus the addresses fetched from outside (tools/publish.py).
      - name: Collect the site
        run: |
          python3 tools/publish.py _site
          test -f _site/.well-known/apple-app-site-association
          test -f _site/games/smalti/config/v1.json

      - uses: actions/configure-pages@v6
      # v4 and later leave out dot-directories unless asked, and /.well-known (the daily share link) is one.
      - uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # The daily share link depends on this file; a red run says it went missing.
      - name: Check the live association file
        run: curl -fsS -o /dev/null https://ninjaapps.net/.well-known/apple-app-site-association
